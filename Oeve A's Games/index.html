<html lang="zh">

    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid #e1e4e8;
            margin-bottom: 40px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #4a6cf7;
        }
        
        .language-switcher {
            position: relative;
        }
        
        .language-btn {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .language-btn:hover {
            background: #f1f5ff;
            border-color: #4a6cf7;
        }
        
        .language-options {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 5px;
            width: 150px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: none;
            z-index: 100;
        }
        
        .language-options.active {
            display: block;
        }
        
        .language-option {
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }
        
        .language-option:hover {
            background: #f1f5ff;
        }
        
        .language-flag {
            width: 20px;
            height: 15px;
            object-fit: cover;
            border-radius: 2px;
        }
        
        .hero {
            text-align: center;
            padding: 50px 0;
            margin-bottom: 50px;
        }
        
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #222;
        }
        
        .hero p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto 30px;
            color: #555;
        }
        
        .btn {
            display: inline-block;
            background: #4a6cf7;
            color: white;
            padding: 12px 25px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #3a5cd8;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }
        
        .feature-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
        }
        
        .feature-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #222;
        }
        
        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 50px;
            border-top: 1px solid #e1e4e8;
            color: #777;
        }
    </style>
</head>

                "hero.button": "了解更多",
                "features.one.title": "多语言支持",
                "features.one.description": "我们的网站支持多种语言，让全球用户都能轻松使用。",
                "features.two.title": "用户体验",
                "features.two.description": "简洁直观的界面设计，提供流畅的用户体验。",
                "features.three.title": "响应式设计",
                "features.three.description": "网站在各种设备上都能完美显示，包括手机和平板。",

                "site.title": "Sitio Web Multilingüe",
                "hero.title": "Bienvenido a nuestro sitio web multilingüe",

                "hero.button": "Aprende Más",
                "features.one.title": "Soporte Multilingüe",
                "features.one.description": "Nuestro sitio web admite múltiples idiomas, lo que lo hace accesible para usuarios de todo el mundo.",
                "features.two.title": "Experiencia de Usuario",
                "features.two.description": "Diseño de interfaz limpio e intuitivo que proporciona una experiencia de usuario fluida.",
                "features.three.title": "Diseño Responsive",
                "features.three.description": "El sitio web se muestra perfectamente en todos los dispositivos, incluidos teléfonos y tabletas.",
                "footer.copyright": "© 2023 Ejemplo de Sitio Web Multilingüe. Todos los derechos reservados."
            },
            fr: {
                "site.title": "Site Web Multilingue",
                "hero.title": "Bienvenue sur notre site web multilingue",
                "hero.description": "Ceci est un site web de démonstration mettant en valeur le support multilingue. Utilisez le sélecteur de langue en haut à droite pour changer la langue.",
                "hero.button": "En Savoir Plus",
                "features.one.title": "Support Multilingue",
                "features.one.description": "Notre site web prend en charge plusieurs langues, le rendant accessible aux utilisateurs du monde entier.",
                "features.two.title": "Expérience Utilisateur",
                "features.two.description": "Interface propre et intuitive offrant une expérience utilisateur fluide.",
                "features.three.title": "Design Responsive",
                "features.three.description": "Le site web s'affiche parfaitement sur tous les appareils, y compris les téléphones et les tablettes.",
                "footer.copyright": "© 2023 Exemple de Site Web Multilingue. Tous droits réservés."
            }
        };

        // 当前语言
        let currentLang = 'zh';

        // DOM 元素
        const languageBtn = document.getElementById('languageBtn');
        const languageOptions = document.getElementById('languageOptions');
        const languageOptionsItems = document.querySelectorAll('.language-option');

        // 切换语言下拉菜单
        languageBtn.addEventListener('click', () => {
            languageOptions.classList.toggle('active');
        });

        // 选择语言
        languageOptionsItems.forEach(option => {
            option.addEventListener('click', () => {
                const lang = option.getAttribute('data-lang');
                changeLanguage(lang);
                languageOptions.classList.remove('active');
                
                // 更新按钮显示
                const flag = option.querySelector('.language-flag').src;
                const text = option.querySelector('span').textContent;
                
                languageBtn.querySelector('.language-flag').src = flag;
                languageBtn.querySelector('span').textContent = text;
            });
        });

        // 更改语言函数
        function changeLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            
            // 更新所有带有data-i18n属性的元素
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (resources[lang] && resources[lang][key]) {
                    element.textContent = resources[lang][key];
                }
            });
            
            // 保存语言偏好到本地存储
            localStorage.setItem('preferredLanguage', lang);
        }

        // 初始化 - 检查是否有保存的语言偏好
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferredLanguage');
            if (savedLang && resources[savedLang]) {
                changeLanguage(savedLang);
                
                // 更新按钮显示
                const selectedOption = document.querySelector(`.language-option[data-lang="${savedLang}"]`);
                if (selectedOption) {
                    const flag = selectedOption.querySelector('.language-flag').src;
                    const text = selectedOption.querySelector('span').textContent;
                    
                    languageBtn.querySelector('.language-flag').src = flag;
                    languageBtn.querySelector('span').textContent = text;
                }
            }
        });
    </script>
