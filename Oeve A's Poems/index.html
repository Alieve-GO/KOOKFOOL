<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宛信诗集 - 我的原创作品</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Noto Sans SC', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f8f6f2 0%, #e8e6e1 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 20px;
            width: 100%;
        }
        
        h1 {
            font-size: 2.8rem;
            color: #5d4037;
            margin-bottom: 10px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.3rem;
            color: #8d6e63;
            font-style: italic;
            margin-bottom: 30px;
        }
        
        .poem-viewer {
            width: 100%;
            max-width: 700px;
            position: relative;
            margin: 30px 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .navigation-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
        }
        
        .arrow {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgba(161, 136, 127, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #5d4037;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .arrow:hover {
            background-color: rgba(161, 136, 127, 0.2);
            transform: scale(1.05);
        }
        
        .arrow.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .arrow.disabled:hover {
            background-color: rgba(161, 136, 127, 0.1);
            transform: none;
        }
        
        .poem-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-left: 5px solid #a1887f;
            text-align: center;
            min-height: 450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .poem-title {
            font-size: 2rem;
            color: #5d4037;
            margin-bottom: 25px;
            font-weight: 500;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0dcd5;
        }
        
        .poem-content {
            color: #616161;
            font-size: 1.2rem;
            line-height: 1.9;
            white-space: pre-wrap;
            margin: 0 auto;
            max-width: 90%;
            text-align: center;
        }
        
        .page-indicator {
            text-align: center;
            color: #8d6e63;
            font-size: 1.1rem;
            margin-top: 30px;
            padding: 12px 20px;
            background: rgba(161, 136, 127, 0.1);
            border-radius: 25px;
            width: fit-content;
            margin: 30px auto;
        }
        
        .poem-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        
        .action-btn {
            background: transparent;
            border: 1px solid #d7ccc8;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            color: #5d4037;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .action-btn:hover {
            background: #5d4037;
            color: white;
            border-color: #5d4037;
        }
        
        footer {
            text-align: center;
            padding: 25px 0;
            color: #9e9e9e;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 40px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #8d6e63;
            font-size: 1.3rem;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #d32f2f;
            font-size: 1.3rem;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .arrow {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
            
            .poem-card {
                padding: 30px 20px;
                min-height: 380px;
            }
            
            .poem-title {
                font-size: 1.7rem;
            }
            
            .poem-content {
                font-size: 1.1rem;
                line-height: 1.8;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.9rem;
            }
            
            .poem-card {
                padding: 25px 15px;
                min-height: 350px;
            }
            
            .poem-title {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
            
            .poem-content {
                font-size: 1rem;
                line-height: 1.7;
            }
            
            .arrow {
                width: 45px;
                height: 45px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>宛信诗集</h1>
        </header>
        
        <div class="poem-viewer">
            <div class="navigation-container">
                <div class="arrow left-arrow" id="leftArrow">
                    <i class="fas fa-chevron-left"></i>
                </div>
                
                <div class="poem-card" id="poemCard">
                    <div class="loading" id="loadingIndicator">
                        <i class="fas fa-spinner fa-spin"></i><br>
                        <span style="margin-top: 15px; display: inline-block;">诗歌加载中...</span>
                    </div>
                </div>
                
                <div class="arrow right-arrow" id="rightArrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
            
            <div class="page-indicator" id="pageIndicator">
                第 <span id="currentPage">1</span> 首 / 共 <span id="totalPoems">0</span> 首
            </div>
            
            <div class="poem-actions">
                <button class="action-btn" id="printBtn">
                    <i class="fas fa-print"></i> 打印
                </button>
                <button class="action-btn" id="shareBtn">
                    <i class="fas fa-share-alt"></i> 分享
                </button>
            </div>
        </div>
        
        <footer>
            <p>All Rights Reserved © 2025</p>
        </footer>
    </div>

    <script>
        // 诗歌数据存储
        let allPoems = [];
        let currentPoemIndex = 0;
        
        // 获取DOM元素
        const poemCard = document.getElementById('poemCard');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const leftArrow = document.getElementById('leftArrow');
        const rightArrow = document.getElementById('rightArrow');
        const pageIndicator = document.getElementById('pageIndicator');
        const currentPageElement = document.getElementById('currentPage');
        const totalPoemsElement = document.getElementById('totalPoems');
        const printBtn = document.getElementById('printBtn');
        const shareBtn = document.getElementById('shareBtn');
        
        // 暂不从服务器API获取文件列表
        const poemFiles = [
            '诗人.txt',
            '心感温度.txt',
            //'待定.txt',
            //'待定.txt',
        ];
        
        // 从服务器加载诗歌内容
        async function loadPoemFromFile(filename) {
            try {
                // 假设诗歌文件放在Oeve A's Poems/poems/目录下
                const response = await fetch(`poems/${filename}`);
                if (!response.ok) {
                    throw new Error('文件加载失败');
                }
                const content = await response.text();
                
                // 解析诗歌内容：第一行为标题，其余为内容
                const lines = content.split('\n');
                const title = lines[0].trim();
                const poemContent = lines.slice(1).join('\n').trim();
                
                return {
                    title,
                    content: poemContent,
                    filename
                };
            } catch (error) {
                console.error('Error loading poem:', error);
                return {
                    title: `诗歌加载失败 (${filename})`,
                    content: '无法加载诗歌内容，请稍后再试。',
                    filename
                };
            }
        }
        
        // 加载所有诗歌
        async function loadAllPoems() {
            try {
                loadingIndicator.style.display = 'block';
                
                const poemPromises = poemFiles.map(filename => loadPoemFromFile(filename));
                allPoems = await Promise.all(poemPromises);
                
                // 更新总诗歌数
                totalPoemsElement.textContent = allPoems.length;
                
                // 显示第一首诗
                showPoem(0);
                
            } catch (error) {
                console.error('Error loading poems:', error);
                poemCard.innerHTML = `
                    <div class="error">
                        <i class="fas fa-exclamation-circle"></i><br>
                        <span style="margin-top: 15px; display: inline-block;">诗歌加载失败，请刷新页面重试。</span>
                    </div>
                `;
            }
        }
        
        // 显示指定索引的诗歌
        function showPoem(index) {
            if (index < 0 || index >= allPoems.length) return;
            
            currentPoemIndex = index;
            const poem = allPoems[index];
            
            // 更新页面指示器
            currentPageElement.textContent = index + 1;
            
            // 更新诗歌卡片内容
            poemCard.innerHTML = `
                <h2 class="poem-title">${poem.title}</h2>
                <div class="poem-content">${poem.content}</div>
            `;
            
            // 更新箭头状态
            updateArrows();
        }
        
        // 更新箭头状态
        function updateArrows() {
            // 左箭头
            if (currentPoemIndex <= 0) {
                leftArrow.classList.add('disabled');
            } else {
                leftArrow.classList.remove('disabled');
            }
            
            // 右箭头
            if (currentPoemIndex >= allPoems.length - 1) {
                rightArrow.classList.add('disabled');
            } else {
                rightArrow.classList.remove('disabled');
            }
        }
        
        // 打印功能
        function printPoem() {
            const poem = allPoems[currentPoemIndex];
            const printContent = poem.content;
            const title = poem.title;
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>打印：${title}</title>
                    <style>
                        body { 
                            font-family: 'Noto Sans SC', sans-serif; 
                            line-height: 1.9;
                            padding: 40px;
                            color: #333;
                            text-align: center;
                        }
                        h1 { 
                            color: #5d4037; 
                            border-bottom: 1px solid #ddd; 
                            padding-bottom: 15px;
                            margin-bottom: 30px;
                            font-size: 2rem;
                        }
                        .content { 
                            white-space: pre-wrap; 
                            font-size: 1.3rem;
                            max-width: 700px;
                            margin: 0 auto;
                        }
                        @media print {
                            body { padding: 15mm; }
                        }
                        @page {
                            size: auto;
                            margin: 15mm;
                        }
                    </style>
                </head>
                <body>
                    <h1>${title}</h1>
                    <div class="content">${printContent}</div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.focus();
            printWindow.print();
        }
        
        // 分享功能
        function sharePoem() {
            const poem = allPoems[currentPoemIndex];
            if (navigator.share) {
                navigator.share({
                    title: poem.title,
                    text: poem.content.substring(0, 100) + '...',
                    url: window.location.href
                })
                .catch(error => {
                    console.log('分享失败:', error);
                    alert('分享功能在此浏览器中不受支持，您可以手动复制诗歌内容进行分享。');
                });
            } else {
                alert('分享功能在此浏览器中不受支持，您可以手动复制诗歌内容进行分享。');
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 加载所有诗歌
            loadAllPoems();
            
            // 左箭头点击事件
            leftArrow.addEventListener('click', () => {
                if (currentPoemIndex > 0) {
                    showPoem(currentPoemIndex - 1);
                }
            });
            
            // 右箭头点击事件
            rightArrow.addEventListener('click', () => {
                if (currentPoemIndex < allPoems.length - 1) {
                    showPoem(currentPoemIndex + 1);
                }
            });
            
            // 打印按钮点击事件
            printBtn.addEventListener('click', printPoem);
            
            // 分享按钮点击事件
            shareBtn.addEventListener('click', sharePoem);
            
            // 键盘导航支持
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && currentPoemIndex > 0) {
                    showPoem(currentPoemIndex - 1);
                } else if (e.key === 'ArrowRight' && currentPoemIndex < allPoems.length - 1) {
                    showPoem(currentPoemIndex + 1);
                }
            });
        });
    </script>
</body>
</html>
